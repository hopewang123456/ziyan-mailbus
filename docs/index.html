    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(15,23,42,0.5);border-radius:8px;font-size:12px">' +
      '<div style="width:6px;height:6px;border-radius:50%;background:' + (online ? 'var(--accent-green)' : 'var(--accent-red)') + ';box-shadow:0 0 6px ' + (online ? 'rgba(16,185,129,0.4)' : 'rgba(239,68,68,0.4)') + '"></div>' +
      icon + ' ' + esc(name) +
      (status.role ? '<span style="color:var(--text-muted);font-size:10px">' + esc(status.role) + '</span>' : '') +
    '</div>';
  }).join('');

  elTeam.innerHTML = '<div class="stat-card"><div class="card-title">👑 团队状态</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">' + agentsList + '</div>' +
    '<div style="display:flex;gap:16px;margin-top:10px;font-size:12px">' +
      '<span style="color:var(--text-muted);cursor:pointer" onclick="showPendingModal()">📬 待回复 <strong style="color:var(--accent-cyan)">' + pendingCount + '</strong></span>' +
      '<span style="color:var(--text-muted);cursor:pointer" onclick="showAlertModal()">🔔 告警 <strong style="color:' + (criticalAlerts.length > 0 ? 'var(--accent-red)' : 'var(--text-muted)') + '">' + alerts.length + '</strong>' +
        (criticalAlerts.length > 0 ? ' <span style="color:var(--accent-red)">🔴 ' + criticalAlerts.length + ' 严重</span>' : '') +
      '</span>' +
      '<span style="color:var(--text-muted);cursor:pointer" onclick="showRunningTasksModal()">🚀 进行中 <strong style="color:var(--accent-cyan)">' + tasks.filter(function(t) { return t.status === 'running'; }).length + '</strong></span>' +
    '</div></div>';

  // ── 2. 我的任务（合并所有状态） ──
  var myTasks = tasks.filter(function(t) {
    var c = t.chain || [];
    if (c.length === 0) return false;
    var first = c[0];
    return first.from === 'lingzhao' || first.from_person === 'lingzhao' || first.agent === 'lingzhao';
  }).sort(function(a, b) { return (b.updated_at || '').localeCompare(a.updated_at || ''); });

  // 渲染我的任务看板
  var elBoard = document.getElementById('ziyanTaskBoard');
  if (elBoard && myTasks.length > 0) {
    var critical = myTasks.filter(function(t) { return t.status === 'failed' || t.status === 'timeout'; });
    var running = myTasks.filter(function(t) { return t.status === 'running'; });
    var recentDone = myTasks.filter(function(t) { return t.status === 'success'; }).slice(0, 5);
    
    var boardHtml = '<div class="stat-card"><div class="card-title">📋 我的任务</div>';
    boardHtml += '<div id="myTaskList">';
    if (critical.length > 0) {
      boardHtml += '<div style="font-size:11px;color:var(--accent-red);margin:8px 0 4px;font-weight:500">🔴 异常</div>';
      boardHtml += critical.map(function(t) { return renderTaskCard(t); }).join('');
    }
    if (running.length > 0) {
      boardHtml += '<div style="font-size:11px;color:var(--accent-green);margin:8px 0 4px;font-weight:500">🟢 进行中</div>';
      boardHtml += running.map(function(t) { return renderTaskCard(t); }).join('');
    }
    boardHtml += '<div style="font-size:11px;color:var(--text-muted);margin:8px 0 4px;font-weight:500">⚪ 最近完成</div>';
    boardHtml += '<div style="max-height:300px;overflow:hidden">' + recentDone.map(function(t) { return renderTaskCard(t); }).join('') + '</div>';
    boardHtml += '</div></div>';
    elBoard.innerHTML = boardHtml;
  }
}

async function renderMyTaskBoard() {
  const elBoard = document.getElementById('ziyanTaskBoard');
  if (elBoard) {
    try {
      const td = await fetchJSON('/api/tasks');
      const allTasks = (td && td.tasks) || [];
      // 筛选子言发起的 —— 取 chain[0] 是 lingzhao 的
      const myTasks = allTasks.filter(t => {
        const c = t.chain || [];
        if (c.length === 0) return false;
        const first = c[0];
        return first.from === 'lingzhao' || first.from_person === 'lingzhao' || first.agent === 'lingzhao';
      }).sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));

      const critical = myTasks.filter(t => t.status === 'failed' || t.status === 'timeout');
      const running = myTasks.filter(t => t.status === 'running');
      const recentDone = myTasks.filter(t => t.status === 'success').slice(0, 5);

      function renderTaskChain(task) {
        const chain = task.chain || [];
        const steps = chain.map((h, i) => {
          const agentId = h.agent || h.to_person || h.to_role || '?';
          const person = h.to_person || h.agent || '';
          const role = h.to_role || '';
          const icon = AGENT_ICONS[person] || AGENT_ICONS[agentId] || (role ? role.slice(0,2) : '?');
          const isLast = i === chain.length - 1;
          const status = h.status || 'pending';
          const isCompleted = status === 'completed' || status === 'done';
          const statusIcon = isCompleted ? '✅' : (status === 'failed' ? '❌' : (isLast && task.status === 'running' ? '⏳' : '✅'));
          const label = person || role || agentId;
          const report = h.report;
          var reportAttr = report ? '1' : '0';
          var summaryAttr = (report && report.summary) || '';
          var info = (role ? role : '') + (person ? '(' + person + ')' : '');
          return '<span class="chain-step" style="font-size:12px;cursor:' + (report ? 'pointer' : 'default') + '" onclick="showChainReport(\'' + jsStr(info) + '\',\'' + jsStr(statusIcon) + '\',\'' + jsStr(summaryAttr) + '\')" title="' + esc(info) + ': ' + (report ? esc(report.conclusion || '') : '等待中') + '">' + statusIcon + ' ' + icon + label + '</span>';
        }).join(' <span style="color:var(--text-muted);font-size:10px">→</span> ');
        return '<div style="font-size:12px;color:var(--text-secondary);margin:4px 0">' + steps + '</div>';
      }

      let boardHtml = '<div class="stat-card"><div class="card-title">📋 我的任务</div>';

      // 过滤标签
      boardHtml += '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">';
      boardHtml += '<button class="btn btn-sm filter-btn active" onclick="switchMyTaskFilter(\'all\')">全部 (' + myTasks.length + ')</button>';
      boardHtml += '<button class="btn btn-sm filter-btn" onclick="switchMyTaskFilter(\'critical\')">🔴 异常 (' + critical.length + ')</button>';
      boardHtml += '<button class="btn btn-sm filter-btn" onclick="switchMyTaskFilter(\'running\')">🟢 进行中 (' + running.length + ')</button>';
      boardHtml += '</div>';

      boardHtml += '<div id="myTaskList">';

      // 异常
      if (critical.length > 0) {
        boardHtml += '<div style="font-size:11px;color:var(--accent-red);margin:8px 0 4px;font-weight:500">🔴 异常</div>';
        boardHtml += critical.map(t => renderTaskCard(t)).join('');
      }
      // 进行中
      if (running.length > 0) {
        boardHtml += '<div style="font-size:11px;color:var(--accent-green);margin:8px 0 4px;font-weight:500">🟢 进行中</div>';
        boardHtml += running.map(t => renderTaskCard(t)).join('');
      }
      // 最近完成
      boardHtml += '<div style="font-size:11px;color:var(--text-muted);margin:8px 0 4px;font-weight:500">⚪ 最近完成</div>';
      boardHtml += '<div id="recentDoneList" style="max-height:300px;overflow:hidden">' + recentDone.map(t => renderTaskCard(t)).join('') + '</div>';
      boardHtml += '</div></div>';
      elBoard.innerHTML = boardHtml;
    } catch(e) {
      elBoard.innerHTML = '';
    }
  }
}

// ═══════════════ 任务链报告弹窗 ═══════════════
var _currentChainTask = null;
var _currentChainIdx = -1;

function showTaskReport(el) {
  var taskData = el.dataset.task;
  var task = null;
  try { if (taskData) task = JSON.parse(decodeURIComponent(taskData)); } catch(e) {}
  if (!task || !task.chain || task.chain.length === 0) {
    document.getElementById('agentModalContent').innerHTML = '<div class=\"header\"><h2>📋 任务</h2><button class=\"btn btn-sm\" onclick=\"closeModal()\">✕</button></div><div style=\"padding:16px;color:var(--text-muted)\">暂无任务链数据</div>';
    document.getElementById('agentModal').classList.add('open');
    return;
  }
  var summary = task.summary || '任务';
  var status = task.status || '';
  var icon = status === 'failed' || status === 'timeout' ? '❌' : status === 'running' ? '⏳' : '✅';
  var html = '<div class="header"><h2>' + icon + ' ' + esc(summary) + '</h2><button class="btn btn-sm" onclick="closeModal()">✕</button></div>';
  html += '<div style="padding:12px;max-height:60vh;overflow-y:auto">';
  if (task && task.chain) {
    var chain = task.chain;
    for (var si = 0; si < chain.length; si++) {
      var h = chain[si];
      var role = h.to_role || h.role || h.agent || '?';
      var person = h.to_person || h.agent || '';
      var s = h.status || 'pending';
      var report = h.report;
      var doneIcon = (s === 'completed' || s === 'done') ? '✅' : (s === 'failed' ? '❌' : '⏳');
      html += '<div style="font-size:12px;padding:8px 0;border-bottom:1px solid rgba(51,65,85,0.08)">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<span style="color:var(--accent-cyan);font-weight:500">' + doneIcon + ' ' + esc(role) + (person ? '(' + esc(person) + ')' : '') + '</span>' +
        '<span style="color:var(--text-muted);font-size:10px">' + esc((h.started_at||'').substring(0,10)) + '</span>' +
        '</div>';
      if (report) {
        html += '<div style="margin-top:4px;font-size:11px;color:var(--text-secondary)">结论: <span style="color:var(--accent-cyan)">' + esc(report.conclusion || '') + '</span></div>';
        if (report.summary) html += '<div style="font-size:11px;color:var(--text-muted);white-space:pre-wrap;margin-top:2px">' + esc(report.summary.substring(0, 300)) + '</div>';
        if (report.raw_reply && report.raw_reply != report.summary) {
          html += '<div style="margin-top:4px"><span style="font-size:11px;color:var(--accent-cyan);cursor:pointer;border-bottom:1px dashed rgba(0,212,255,0.3)" onclick="alert(\'' + esc(report.raw_reply.substring(0, 500)) + '\')">📄 查看原始回复</span></div>';
        }
      } else {
        html += '<div style="font-size:11px;color:var(--text-muted);margin-top:4px">⏳ 等待中</div>';
      }
      html += '</div>';
    }
  } else {
    html += '<div style="color:var(--text-muted);padding:12px">暂无任务链数据</div>';
  }
  html += '</div>';
  document.getElementById('agentModalContent').innerHTML = html;
  document.getElementById('agentModal').classList.add('open');
}

function showChainReportFromAttr(el) {
  var reportData = el.dataset.report;
  var info = el.dataset.info || '?';
  if (reportData) {
    try {
      var report = JSON.parse(decodeURIComponent(reportData));
      showChainReport(info, '✅', report);
    } catch(e) {
      showChainReport(info, '✅', null);
    }
  } else {
    showChainReport(info, '⏳', null);
  }
}

function showStepReport(stepIdx) {
  if (!_currentChainTask || !_currentChainTask.chain) return;
  var h = _currentChainTask.chain[stepIdx];
  if (!h) { showChainReport('?', '⏳', null); return; }
  var info = (h.to_role || h.role || '') + ((h.to_person || h.agent) ? '(' + (h.to_person || h.agent) + ')' : '');
  showChainReport(info, h.status === 'completed' || h.status === 'done' ? '✅' : '⏳', h.report || null);
}

function showChainReport(info, icon, report) {
  var detailHtml = '';
  if (report) {
    detailHtml = '<div style="padding:12px;background:rgba(15,23,42,0.6);border-radius:8px;font-size:12px;line-height:1.7">';
    if (report.conclusion) detailHtml += '<div style="color:var(--accent-cyan);font-weight:500;margin-bottom:8px">结论: ' + esc(report.conclusion) + '</div>';
    if (report.summary) detailHtml += '<div style="margin-bottom:8px;white-space:pre-wrap;font-size:11px;color:var(--text-secondary)">' + esc(report.summary) + '</div>';
    
    // 根据模板渲染不同内容
    var tmpl = report.template || '';
    var det = report.details || {};
    
    if (!tmpl) {
      // 没有模板类型，直接展示 summary
      if (report.summary) {
        detailHtml += '<div style="white-space:pre-wrap;font-size:11px;color:var(--text-secondary);background:rgba(0,0,0,0.2);padding:8px;border-radius:4px">' + esc(report.summary) + '</div>';
      }
    } else if (tmpl === 'review-report' || tmpl === '审查报告') {
      // 审查报告：显示 issues 列表
      if (det.issues && det.issues.length > 0) {
        detailHtml += '<div style="font-weight:600;font-size:12px;color:var(--accent-gold);margin-bottom:4px">发现问题:</div>';
        det.issues.forEach(function(iss) {
          var sevColor = iss.severity === 'critical' ? 'var(--accent-red)' : iss.severity === 'major' ? 'var(--accent-gold)' : 'var(--accent-cyan)';
          detailHtml += '<div style="font-size:11px;padding:4px 8px;margin:2px 0;background:rgba(15,23,42,0.4);border-radius:4px;border-left:2px solid ' + sevColor + '">' +
            '<span style="color:' + sevColor + ';font-weight:500">[' + esc(iss.severity) + ']</span> ' +
            (iss.file ? '<span style="color:var(--text-muted)">' + esc(iss.file) + (iss.line ? ':' + iss.line : '') + '</span> ' : '') +
            esc(iss.desc || '') + '</div>';
        });
      }
      if (det.passed_checks && det.passed_checks.length > 0) {
        detailHtml += '<div style="margin-top:6px;font-size:11px;color:var(--accent-green)">✅ 通过检查: ' + det.passed_checks.join(', ') + '</div>';
      }
      if (det.review_tool) detailHtml += '<div style="margin-top:4px;font-size:11px;color:var(--text-muted)">工具: ' + esc(det.review_tool) + '</div>';
    } else if (tmpl === 'test-report' || tmpl === '测试报告') {
      // 测试报告：显示逐项结果
      if (det.results && det.results.length > 0) {
        detailHtml += '<div style="font-weight:600;font-size:12px;color:var(--accent-cyan);margin-bottom:4px">测试结果:</div>';
        var passCount = 0, failCount = 0;
        det.results.forEach(function(r) {
          var passed = r.status === 'pass';
          if (passed) passCount++; else failCount++;
          detailHtml += '<div style="font-size:11px;padding:3px 8px;margin:1px 0;background:rgba(15,23,42,0.4);border-radius:4px">' +
            (passed ? '✅' : '❌') + ' ' + esc(r.name || r.desc || '') + '</div>';
        });
        if (det.total || passCount || failCount) {
          detailHtml += '<div style="margin-top:6px;font-size:11px;color:var(--text-muted)">合计: ' + (det.total || (passCount + failCount)) + ' | ✅ ' + (det.passed || passCount) + ' | ❌ ' + (det.failed || failCount) + '</div>';
        }
      }
      if (det.environment) detailHtml += '<div style="margin-top:4px;font-size:11px;color:var(--text-muted)">环境: ' + esc(det.environment) + '</div>';
    } else if (tmpl === 'dev-report' || tmpl === '开发报告') {
      // 开发报告：显示改动文件
      if (det.changes && det.changes.length > 0) {
        detailHtml += '<div style="font-weight:600;font-size:12px;color:var(--accent-cyan);margin-bottom:4px">改动文件:</div>';
        det.changes.forEach(function(c) {
          var f = c.file || c;
          var s = c.summary || '';
          detailHtml += '<div style="font-size:11px;padding:2px 0"><span style="color:var(--accent-cyan)">📄 ' + esc(f) + '</span>' + (s ? ' — ' + esc(s) : '') + '</div>';
        });
      }
      if (det.self_test) detailHtml += '<div style="margin-top:4px;font-size:11px">自测: ' + (det.self_test === 'pass' ? '✅ 通过' : '❌ 失败') + '</div>';
      if (det.test_output) detailHtml += '<pre style="font-size:11px;color:var(--text-muted);margin-top:4px;white-space:pre-wrap;font-family:inherit;background:rgba(0,0,0,0.2);padding:6px;border-radius:4px">' + esc(det.test_output.substring(0, 300)) + '</pre>';
    } else if (tmpl === 'approve-report' || tmpl === '验收报告') {
      // 验收报告：显示检查项
      if (det.checks && det.checks.length > 0) {
        detailHtml += '<div style="font-weight:600;font-size:12px;color:var(--accent-cyan);margin-bottom:4px">验收检查:</div>';
        det.checks.forEach(function(c) {
          var ok = c.status === 'yes' || c.status === 'pass';
          detailHtml += '<div style="font-size:11px;padding:2px 0">' + (ok ? '✅' : '⬜') + ' ' + esc(c.name || '') + '</div>';
        });
      }
    } else if (tmpl === 'patrol-report' || tmpl === '巡检报告') {
      // 巡检报告
      if (det.online_agents !== undefined) detailHtml += '<div style="font-size:11px;padding:2px 0">在线 Agent: ' + det.online_agents + '</div>';
      if (det.pending_tasks !== undefined) detailHtml += '<div style="font-size:11px;padding:2px 0">待办任务: ' + det.pending_tasks + '</div>';
    } else if (tmpl === 'scheme-report' || tmpl === '方案报告') {
      if (det.design_doc) detailHtml += '<div style="font-size:11px;padding:2px 0">📄 方案文档: ' + esc(det.design_doc) + '</div>';
      if (det.key_decisions) detailHtml += '<div style="font-size:11px;padding:2px 0">关键决策: ' + det.key_decisions.join(', ') + '</div>';
    } else if (tmpl === 'research-report' || tmpl === '调研报告') {
      if (det.recommendation) detailHtml += '<div style="font-size:11px;padding:2px 0;color:var(--accent-cyan)">推荐: ' + esc(det.recommendation) + '</div>';
      if (det.candidates) detailHtml += '<div style="font-size:11px;padding:2px 0">候选方案: ' + det.candidates.length + ' 个</div>';
    }
    
    // 如果有未渲染的 details 字段，兜底展示
    if (det && typeof det === 'object') {
      var renderedKeys = ['issues', 'passed_checks', 'review_tool', 'results', 'total', 'passed', 'failed', 'environment', 'changes', 'self_test', 'test_output', 'checks', 'online_agents', 'pending_tasks', 'design_doc', 'key_decisions', 'recommendation', 'candidates'];
      var remaining = {};
      var hasRemaining = false;
      for (var k in det) {
        if (det.hasOwnProperty(k) && renderedKeys.indexOf(k) === -1) {
          remaining[k] = det[k];
          hasRemaining = true;
        }
      }
      if (hasRemaining) {
        detailHtml += '<pre style="font-size:11px;color:var(--text-muted);margin-top:8px;overflow:auto;max-height:150px;background:rgba(0,0,0,0.3);padding:6px;border-radius:4px;white-space:pre-wrap;font-family:inherit">' + esc(JSON.stringify(remaining, null, 2).substring(0, 600)) + '</pre>';
      }
    }
    
    detailHtml += '</div>';
  } else {
    detailHtml = '<div style="color:var(--text-muted);padding:12px">该步骤暂无报告</div>';
  }
  document.getElementById('agentModalContent').innerHTML =
    '<div class="header"><h2>📋 步骤详情</h2><button class="btn btn-sm" onclick="closeModal()">✕</button></div>' +
    '<div style="padding:16px;font-size:13px;line-height:1.7">' +
    '<div style="font-size:24px;margin-bottom:8px">' + icon + '</div>' +
    '<div style="color:var(--accent-cyan);font-weight:600;margin-bottom:8px">' + info + '</div>' +
    detailHtml +
    '</div>';
  document.getElementById('agentModal').classList.add('open');
}

function renderTaskCard(task) {
  _currentChainTask = task;
  const chain = task.chain || [];
  const summary = (task.summary || '').substring(0, 60) + ((task.summary || '').length > 60 ? '...' : '');
  const updatedAt = (task.updated_at || '').substring(0, 16);
  const currentStep = chain.length > 0 ? chain[chain.length - 1] : null;
  const currentAgent = currentStep ? (currentStep.to_person || currentStep.agent || '?') : '?';
  const currentIcon = AGENT_ICONS[currentAgent] || '?';
  const currentRole = currentStep ? (currentStep.to_role || '') : '';
  const isRunning = task.status === 'running';

  // 流转路径 — 每步可点击查看报告
  const stepsHtml = chain.map((h, i) => {
    const agent = h.agent || h.to_person || '?';
    const role = h.to_role || '';
    const icon = AGENT_ICONS[agent] || '?';
    const s = h.status || 'pending';
    const isCompleted = s === 'completed' || s === 'done';
    const statusIcon = isCompleted ? '✅' : (s === 'failed' ? '❌' : '⏳');
    const hasReport = h.report ? 1 : 0;
    var info = role ? role : agent;
    var stepIdx = i;
    var reportData = h.report ? encodeURIComponent(JSON.stringify(h.report)) : '';
    return '<span style="font-size:12px;white-space:nowrap;cursor:' + (hasReport ? 'pointer' : 'default') + ';border-bottom:' + (hasReport ? '1px dashed rgba(0,212,255,0.3)' : 'none') + '" data-report=\'' + reportData + '\' data-info=\'' + jsStr(info) + '\' onclick="showChainReportFromAttr(this)" title="' + (hasReport ? '点击查看报告' : '等待中') + '">' + statusIcon + ' ' + icon + agent + '</span>';
  }).join(' <span style="color:var(--text-muted);font-size:10px">→</span> ');

  const statusColor = task.status === 'failed' || task.status === 'timeout' ? 'var(--accent-red)' :
    task.status === 'running' ? 'var(--accent-cyan)' : 'var(--text-muted)';

  return '<div class="msg-item" style="margin-bottom:6px;border-left:3px solid ' + statusColor + ';cursor:pointer" data-task=\'' + encodeURIComponent(JSON.stringify({chain: task.chain || [], status: task.status, summary: task.summary})) + '\' onclick="showTaskReport(this)">' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' + esc(summary) + '</div>' +
      '<span style="font-size:10px;color:var(--text-muted);white-space:nowrap;margin-left:8px">' + updatedAt + '</span>' +
    '</div>' +
    '<div style="font-size:12px;color:var(--text-secondary);margin:4px 0;overflow-x:auto;white-space:nowrap;padding:4px 0">' + stepsHtml + '</div>' +
    (isRunning && currentStep ? '<div style="font-size:11px;color:var(--accent-cyan)">⏳ 当前: ' + currentIcon + (currentRole ? '(' + currentRole + ')' : '') + '</div>' : '') +
  '</div>';
}

function switchMyTaskFilter(filter) {
  document.querySelectorAll('#ziyanTaskBoard .filter-btn').forEach(b => b.classList.remove('active'));

  btns.forEach(b => { if (b.textContent.includes(filter === 'all' ? '全部' : filter === 'critical' ? '异常' : '进行中')) b.classList.add('active'); });

  });
}

function renderMarkdown(md) {
  // 转义HTML
  let h = esc(md);
  // 去掉字符画表格边框
  h = h.replace(/[╔╗╚╝═║]/g, '');
  // 分隔线
  h = h.replace(/━+/g, '<hr style="border:none;border-top:1px solid rgba(51,65,85,0.15);margin:8px 0">');
  h = h.replace(/─{4,}/g, '<hr style="border:none;border-top:1px solid rgba(51,65,85,0.1);margin:6px 0">');
  
  // 先把 Markdown 行按块处理，避免 <br> 干扰
  var lines = h.split('\n');
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();
    
    // 跳过空行
    if (!trimmed) { continue; }
    
    // 标题
    if (/^### (.+)/.test(trimmed)) { out.push('<h4 style="color:var(--accent-cyan);margin:10px 0 3px;font-size:13px;font-weight:600">' + trimmed.replace(/^### /, '') + '</h4>'); continue; }
    if (/^## (.+)/.test(trimmed)) { out.push('<h3 style="color:var(--accent-cyan);margin:14px 0 5px;font-size:14px;border-bottom:1px solid rgba(51,65,85,0.15);padding-bottom:2px;font-weight:600">' + trimmed.replace(/^## /, '') + '</h3>'); continue; }
    if (/^# (.+)/.test(trimmed)) { out.push('<h2 style="color:var(--accent-cyan);margin:18px 0 8px;font-size:16px;border-bottom:1px solid rgba(51,65,85,0.2);padding-bottom:3px;font-weight:600">' + trimmed.replace(/^# /, '') + '</h2>'); continue; }
    // 中文数字标题：一、整体状态  二、xxx
    if (/^[一二三四五六七八九十]+、/.test(trimmed)) { out.push('<div style="color:var(--accent-cyan);font-size:13px;font-weight:600;margin:12px 0 4px">' + trimmed + '</div>'); continue; }
    // 统计指标行：指标 | 状态
    if (/^[^\|]+\|/.test(trimmed) && trimmed.length < 40) { out.push('<div style="font-size:12px;font-weight:600;color:var(--text-secondary);padding:2px 0">' + trimmed + '</div>'); continue; }
    
    // 状态行：[角色] 数据
    var stateMatch = trimmed.match(/^\[(.+?)\]\s{3,}(.+)/);
    if (stateMatch) {
      out.push('<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(51,65,85,0.06)"><span style="color:var(--accent-cyan)">' + stateMatch[1] + '</span><span>' + stateMatch[2] + '</span></div>');
      continue;
    }
    
    // 短标签 [xxx]
    if (/^\[([^\]]{2,16})\]\s*$/.test(trimmed)) {
      out.push('<strong style="color:var(--accent-cyan);font-size:12px;display:block;margin:6px 0 2px">' + trimmed + '</strong>');
      continue;
    }
    
    // 表格行 | xxx | xxx |
    if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
      var cells = trimmed.slice(1, -1).split('|').map(function(c) { return c.trim(); });
      if (cells.every(function(c) { return /^[-:\s]+$/.test(c); })) continue;
      // 表头检测：如果这一行所有单元格都是短文本(不含数字、不是分隔线)，则是表头
      var isHeader = cells.every(function(c) { return c.length < 15 && !/^[-:\s]+$/.test(c) && !/\d/.test(c) && c.length > 0; });
      var cellStyle = 'border:1px solid rgba(51,65,85,0.3);padding:3px 8px;font-size:12px';
      if (isHeader) cellStyle += ';font-weight:600;color:var(--accent-cyan)';
      out.push('<tr><td style="' + cellStyle + '">' + cells.join('</td><td style="' + cellStyle + '">') + '</td></tr>');
      continue;
    }
    
    // 普通段落
    var processed = trimmed
      .replace(/\*\*(.+?)\*\*/g, function(m, c) { return /[<>]/.test(c) ? '**' + esc(c) + '**' : '<strong style="color:var(--text-primary)">' + c + '</strong>'; })
      .replace(/`([^`]+)`/g, function(m, c) { return /[<>]/.test(c) ? '`' + esc(c) + '`' : '<code style="background:rgba(0,212,255,0.08);color:var(--accent-cyan);padding:1px 4px;border-radius:3px;font-size:12px">' + c + '</code>'; });
    out.push('<div style="font-size:12px;line-height:1.6;padding:1px 0">' + processed + '</div>');
  }
  
  // 把连续的 <tr> 包在 <table> 里
  var html = out.join('\n');
  html = html.replace(/((?:<tr>.*?<\/tr>\n?)+)/g, '<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:12px"><tbody>$1</tbody></table>');
  
  return html;
}

  if (names.length === 0) ['lingzhao','lingjin','lingxi','lingxiao','xiaoqi','dali','yige','lingjian','lingyan'].forEach(n => addAgentOpt(sel, n));

async function doSend() {
  const to = document.getElementById('sendTo').value;
  const content = document.getElementById('sendContent').value.trim();
  const priority = document.getElementById('sendPriority').value;
  if (!content) { toast('请输入消息内容', 'error'); return; }
  const btn = document.getElementById('sendBtn'); btn.disabled = true; btn.textContent = '⏳';
  try {
    if (to === '__broadcast__') {
      const agents = window._agents || [];
      const names = agents.map(a => a.name || a).filter(n => n !== 'ziyan');
      if (names.length === 0) { toast('没有可发送的 agent', 'error'); btn.disabled = false; btn.textContent = '发送'; return; }
      let ok = 0, fail = 0;
      for (const name of names) { try { const r = await fetch('/api/send-msg', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:name,content,from:'ziyan',priority})}); if(r.ok) ok++; else fail++; } catch(e) { fail++; } }
      toast(`📡 广播完成: ${ok} 成功, ${fail} 失败`, fail === 0 ? 'success' : 'error');
    } else {
      const r = await fetch('/api/send-msg', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,content,from:'ziyan',priority})});
      if (!r.ok) { toast('发送失败: ' + (await r.text()), 'error'); return; }
      toast(`✅ 已发送给 ${AGENT_NAMES[to] || to}`, 'success');
    }
    closeSendModal(); renderZiyanTab();
  } catch(e) { toast('发送异常: ' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = '发送';
}

async function sendMsg() {
  const to = document.getElementById('msgTo').value;
  const type = document.getElementById('msgType').value;

    const msg = { id: 'manual-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), from: 'lingzhao', to: to, type: type || 'notice', priority: 'normal', content: content, created_at: new Date().toISOString() };

}
