  let statusHtml = '';
  if (hb && hb.agents) {
    const names = Object.keys(AGENT_NAMES);
    const chips = names.map(name => {
      const state = hb.agents[name];
      return `<span style="display:inline-block;padding:4px 10px;margin:3px;background:rgba(30,41,59,0.6);border-radius:8px;font-size:13px">${state && state.status === 'online' ? '🟢' : '🔴'} ${AGENT_ICONS[name] || '?'}${AGENT_NAMES[name] || name}</span>`;
    }).join('');
    const unreadList = names.filter(name => { const s = agentStatuses[name]; return s && (s.has_unread || s.active_messages > 0); }).map(name => `${AGENT_ICONS[name] || '?'}${AGENT_NAMES[name]} 📩`).join(' · ');
    statusHtml = chips + (unreadList ? '<div style="margin-top:8px;font-size:12px;color:var(--accent-gold)">未读: ' + unreadList + '</div>' : '');
  } else { statusHtml = '<div style="color:var(--text-muted);font-size:13px">⏳ 加载中...</div>'; }
  elTeam.innerHTML = `<div class="stat-card"><div class="card-title">🏢 团队状态</div><div>${statusHtml}</div></div>`;

  let alertHtml = '';
  if (alertsData && alertsData.alerts && alertsData.alerts.length > 0) {
    const recent = alertsData.alerts.slice(-5).reverse();
    alertHtml = recent.map(a => `<div class="msg-item" style="margin-bottom:4px;padding:8px 10px">
      <div class="head">${a.severity === 'critical' ? '🔴' : a.severity === 'warn' ? '🟡' : '🔵'} ${a.severity} ${a.type} · ${a.agent}${a.assignee ? ' · 🔍'+AGENT_NAMES[a.assignee]||a.assignee+'处理' : ''} · ${(a.created_at||'').substring(0,16)}</div>
      <div class="body" style="font-size:12px">${esc(a.message || '')}</div>
    </div>`).join('');
  } else { alertHtml = '<div style="color:var(--accent-green);font-size:13px">✅ 无告警</div>'; }
  elAlerts.innerHTML = `<div class="stat-card"><div class="card-title">🔔 最近告警</div><div style="max-height:220px;overflow-y:auto">${alertHtml}</div></div>`;

  // ── 子言全局任务看板 ──
  const elBoard = document.getElementById('ziyanTaskBoard');
  if (elBoard) {
    try {
      const td = await fetchJSON('/api/tasks');
      const allTasks = (td && td.tasks) || [];
      // 筛选子言发起的 —— 取 chain[0] 是 lingzhao 的
      const myTasks = allTasks.filter(t => {
        const c = t.chain || [];
        return c.length > 0 && c[0].agent === 'lingzhao';
      }).sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));

      const critical = myTasks.filter(t => t.status === 'failed' || t.status === 'timeout');
      const running = myTasks.filter(t => t.status === 'running');
      const recentDone = myTasks.filter(t => t.status === 'success').slice(0, 5);

      function renderTaskChain(task) {
        const chain = task.chain || [];
        const steps = chain.map((h, i) => {
          const icon = AGENT_ICONS[h.agent] || '?';
          const isLast = i === chain.length - 1;
          const status = h.status || 'pending';
          const statusIcon = status === 'done' ? '✅' : (status === 'failed' ? '❌' : (isLast && task.status === 'running' ? '⏳' : '✅'));
          return `<span style="font-size:12px">${statusIcon} ${icon}${h.agent}</span>`;
        }).join(' <span style="color:var(--text-muted);font-size:10px">→</span> ');
        return `<div style="font-size:12px;color:var(--text-secondary);margin:4px 0">${steps}</div>`;
      }

      let boardHtml = '<div class="stat-card"><div class="card-title">📋 我的任务</div>';

      // 过滤标签
      boardHtml += '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">';
      boardHtml += '<button class="btn btn-sm filter-btn active" onclick="switchMyTaskFilter(\'all\')">全部 (' + myTasks.length + ')</button>';
      boardHtml += '<button class="btn btn-sm filter-btn" onclick="switchMyTaskFilter(\'critical\')">🔴 异常 (' + critical.length + ')</button>';
      boardHtml += '<button class="btn btn-sm filter-btn" onclick="switchMyTaskFilter(\'running\')">🟢 进行中 (' + running.length + ')</button>';
      boardHtml += '</div>';

      boardHtml += '<div id="myTaskList">';

      // 异常
      if (critical.length > 0) {
        boardHtml += '<div style="font-size:11px;color:var(--accent-red);margin:8px 0 4px;font-weight:500">🔴 异常</div>';
        boardHtml += critical.map(t => renderTaskCard(t)).join('');
      }
      // 进行中
      if (running.length > 0) {
        boardHtml += '<div style="font-size:11px;color:var(--accent-green);margin:8px 0 4px;font-weight:500">🟢 进行中</div>';
        boardHtml += running.map(t => renderTaskCard(t)).join('');
      }
      // 最近完成
      boardHtml += '<div style="font-size:11px;color:var(--text-muted);margin:8px 0 4px;font-weight:500">⚪ 最近完成</div>';
      boardHtml += '<div id="recentDoneList" style="max-height:300px;overflow:hidden">' + recentDone.map(t => renderTaskCard(t)).join('') + '</div>';
      boardHtml += '</div></div>';

      elBoard.innerHTML = boardHtml;
    } catch(e) {
      elBoard.innerHTML = '';
    }
  }
}

function renderTaskCard(task) {
  const chain = task.chain || [];
  const summary = (task.summary || '').substring(0, 60) + ((task.summary || '').length > 60 ? '...' : '');
  const updatedAt = (task.updated_at || '').substring(0, 16);
  const currentStep = chain.length > 0 ? chain[chain.length - 1] : null;
  const currentAgent = currentStep ? currentStep.agent : '?';
  const currentIcon = AGENT_ICONS[currentAgent] || '?';
  const isRunning = task.status === 'running';

  // 流转路径
  const stepsHtml = chain.map((h, i) => {
    const icon = AGENT_ICONS[h.agent] || '?';
    const isLast = i === chain.length - 1;
    const s = h.status || 'pending';
    const statusIcon = s === 'done' ? '✅' : (s === 'failed' ? '❌' : '⏳');
    return '<span style="font-size:12px;white-space:nowrap">' + statusIcon + ' ' + icon + h.agent + '</span>';
  }).join(' <span style="color:var(--text-muted);font-size:10px">→</span> ');

  const statusColor = task.status === 'failed' || task.status === 'timeout' ? 'var(--accent-red)' :
    task.status === 'running' ? 'var(--accent-cyan)' : 'var(--text-muted)';

  return '<div class="msg-item" style="margin-bottom:6px;border-left:3px solid ' + statusColor + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' + esc(summary) + '</div>' +
      '<span style="font-size:10px;color:var(--text-muted);white-space:nowrap;margin-left:8px">' + updatedAt + '</span>' +
    '</div>' +
    '<div style="font-size:12px;color:var(--text-secondary);margin:4px 0;overflow-x:auto;white-space:nowrap;padding:4px 0">' + stepsHtml + '</div>' +
    (isRunning && currentStep ? '<div style="font-size:11px;color:var(--accent-cyan)">⏳ 当前: ' + currentIcon + currentAgent + '</div>' : '') +
  '</div>';
}

function switchMyTaskFilter(filter) {
  document.querySelectorAll('#ziyanTaskBoard .filter-btn').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('#ziyanTaskBoard .filter-btn');
  btns.forEach(b => { if (b.textContent.includes(filter === 'all' ? '全部' : filter === 'critical' ? '异常' : '进行中')) b.classList.add('active'); });
  const list = document.getElementById('myTaskList');
  if (!list) return;
  list.querySelectorAll('div[style*="font-size:11px;color"]').forEach(s => {
    if (filter === 'all') { s.style.display = ''; s.nextElementSibling.style.display = ''; }
    else if (filter === 'critical' && s.textContent.includes('异常')) { s.style.display = ''; s.nextElementSibling.style.display = ''; }
    else if (filter === 'running' && s.textContent.includes('进行中')) { s.style.display = ''; s.nextElementSibling.style.display = ''; }
    else { s.style.display = 'none'; s.nextElementSibling.style.display = 'none'; }
  });
}

// ═══════════════ 回复 ═══════════════

// ═══════════════ 回复 ═══════════════

function openReply(to, msgId, origSummary) {
  _replyContext = {to, msg_id: msgId, origContent: origSummary};
  document.getElementById('replyTitle').textContent = '💬 回复 ' + (AGENT_NAMES[to] || to);
  document.getElementById('replyOrigMsg').textContent = '原消息: ' + origSummary;
  document.getElementById('replyInput').value = '';
  document.getElementById('replyModal').classList.add('open');
  document.getElementById('replyInput').focus();
}

function closeReply() {
  document.getElementById('replyModal').classList.remove('open');
  _replyContext = null;
}

async function sendReply() {
  const ctx = _replyContext;
  if (!ctx || !ctx.to) { toast('回复上下文丢失', 'error'); return; }
  const content = document.getElementById('replyInput').value.trim();
  if (!content) { toast('请输入回复内容', 'error'); return; }
  try {
    const r = await fetch('/api/send-msg', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from: 'lingzhao', to: ctx.to, type: 'reply', priority: 'normal', content: content}),
    });
    const data = await r.json();
    if (data.status === 'ok') {
      toast('✅ 已回复 ' + AGENT_NAMES[ctx.to], 'success');
      closeReply();
      if (ctx.msg_id) { try { await fetch('/api/mark-read/lingzhao', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({msg_id: ctx.msg_id}) }); } catch(e) {} }
      renderZiyanTab();
    } else { toast('发送失败: ' + (data.error || 'unknown'), 'error'); }
  } catch(e) { toast('发送失败: ' + e.message, 'error'); }
}

// ═══════════════ 搜索 ═══════════════

let _searchAbort = null;

async function doSearch() {
  const q = document.getElementById('searchBox').value.trim();
  if (!q) { toast('请输入搜索关键词', 'error'); return; }
  if (_searchAbort) _searchAbort.abort();
  _searchAbort = new AbortController();
  try {
    const r = await fetch(apiUrl('/api/search?q=' + encodeURIComponent(q)), {signal: _searchAbort.signal});
    const data = await r.json();
    const results = data.results || [];
    const total = data.total || results.length;
    document.getElementById('searchResultCount').textContent = total + ' 条结果';
    const el = document.getElementById('searchResults');
    if (results.length === 0) {
      el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">无匹配结果</div>';
    } else {
      el.innerHTML = results.map(m => {
        const time = (m.created_at || '').substring(0, 16);
        const contentShort = (m.content || '').substring(0, 120) + ((m.content || '').length > 120 ? '...' : '');
        return `<div class="msg-block">
          <div class="meta">${esc(m.from)} → ${esc(m.to)} · ${esc(m.type)} · ${esc(m.status || '')} · ${time}</div>
          <div class="text">${esc(contentShort)}</div>
        </div>`;
      }).join('');
    }
    document.getElementById('searchModal').classList.add('open');
  } catch(e) {
    if (e.name !== 'AbortError') toast('搜索失败: ' + e.message, 'error');
  }
}

function closeSearch() {
  document.getElementById('searchModal').classList.remove('open');
}

// ── 巡检日报 ──
async function renderPatrolTab() {
  const el = document.getElementById('patrolReportList');
  if (!el) return;
  let data = null;
  try {
    data = await fetchJSON('/api/patrol-reports');
  } catch(e) {
    el.innerHTML = '<div style="color:var(--text-muted);padding:20px">⚠️ 巡检日报加载失败（API 可能还未就绪）</div>';
    return;
  }
  const reports = data.reports || [];
  if (reports.length === 0) {
    el.innerHTML = '<div style="color:var(--text-muted);padding:20px;text-align:center">📋 暂无巡检日报</div>';
    return;
  }
  el.innerHTML = reports.map(r => {
    const date = r.date || r.created_at || '';
    const summary = (r.summary || r.content || '').substring(0, 200);
    var fileEnc = jsStr(r.file || '');
    return '<div class="bulletin-item" style="cursor:pointer" onclick="showPatrolDetail(\'' + fileEnc + '\')">' +
      '<div class="meta">' + date + '</div>' +
      '<div class="title">📋 巡检日报 · ' + date + '</div>' +
      '<div class="body">' + esc(summary) + '</div></div>';
  }).join('');
}

async function showPatrolDetail(file) {
  if (!file) return;
  let content = '';
  try {
    const r = await fetch('/api/report-content/' + encodeURIComponent(file));
    if (r.ok) content = await r.text();
  } catch(e) {}
  if (!content) content = '报告加载失败';
  document.getElementById('agentModalContent').innerHTML = '<div class="header">' +
    '<h2>📋 ' + esc(file) + '</h2>' +
    '<button class="btn btn-sm" onclick="closeModal()">✕</button></div>' +
    '<div style="font-size:13px;line-height:1.7;white-space:pre-wrap;background:rgba(15,23,42,0.8);border-radius:8px;padding:16px;max-height:70vh;overflow:auto">' + esc(content) + '</div>';
  document.getElementById('agentModal').classList.add('open');
}

// ═══════════════ 心跳触发 ═══════════════

async function triggerHeartbeat() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    const data = await fetchJSON('/api/heartbeat?force=1');
    rawData.hb = data; renderHeartbeat(data);
  } catch(e) {}
  btn.textContent = '💓 心跳'; btn.disabled = false;
}

// ═══════════════ 发信功能 ═══════════════

function openSendModal() {
  const sel = document.getElementById('sendTo');
  sel.innerHTML = '';
  const agents = window._agents || [];
  const names = agents.map(a => a.name || a).filter(n => n !== 'ziyan');
  function addAgentOpt(sel, n) { const opt = document.createElement('option'); opt.value = n; opt.textContent = (AGENT_NAMES[n] ? AGENT_NAMES[n] + ' (' + n + ')' : n); sel.appendChild(opt); }
  if (names.length === 0) ['lingzhao','lingjin','lingxi','lingxiao','xiaoqi','dali','yige','lingjian','lingyan'].forEach(n => addAgentOpt(sel, n));
  else names.forEach(n => addAgentOpt(sel, n));
  const allOpt = document.createElement('option'); allOpt.value = '__broadcast__'; allOpt.textContent = '📡 全部广播'; sel.appendChild(allOpt);
  document.getElementById('sendContent').value = ''; document.getElementById('sendPriority').value = 'normal';
  document.getElementById('sendBtn').disabled = false; document.getElementById('sendBtn').textContent = '发送';
  document.getElementById('sendModal').classList.add('open'); document.getElementById('sendContent').focus();
}

function closeSendModal() { document.getElementById('sendModal').classList.remove('open'); }

async function doSend() {
  const to = document.getElementById('sendTo').value;
  const content = document.getElementById('sendContent').value.trim();
  const priority = document.getElementById('sendPriority').value;
  if (!content) { toast('请输入消息内容', 'error'); return; }
  const btn = document.getElementById('sendBtn'); btn.disabled = true; btn.textContent = '⏳';
  try {
    if (to === '__broadcast__') {
      const agents = window._agents || [];
      const names = agents.map(a => a.name || a).filter(n => n !== 'ziyan');
      if (names.length === 0) { toast('没有可发送的 agent', 'error'); btn.disabled = false; btn.textContent = '发送'; return; }
      let ok = 0, fail = 0;
      for (const name of names) { try { const r = await fetch('/api/send-msg', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:name,content,from:'ziyan',priority})}); if(r.ok) ok++; else fail++; } catch(e) { fail++; } }
      toast(`📡 广播完成: ${ok} 成功, ${fail} 失败`, fail === 0 ? 'success' : 'error');
    } else {
      const r = await fetch('/api/send-msg', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,content,from:'ziyan',priority})});
      if (!r.ok) { toast('发送失败: ' + (await r.text()), 'error'); return; }
      toast(`✅ 已发送给 ${AGENT_NAMES[to] || to}`, 'success');
    }
    closeSendModal(); renderZiyanTab();
  } catch(e) { toast('发送异常: ' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = '发送';
}

// ═══════════════ 发消息（带模板） ═══════════════

async function openSendMsg() {
  const modal = document.getElementById('sendMsgModal');
  if (!modal) return;
  modal.classList.add('open');
  try { const data = await fetchJSON('/api/templates'); _msgTemplates = data.templates || []; } catch(e) { _msgTemplates = []; }
  document.getElementById('msgTemplates').innerHTML = _msgTemplates.map(t => `<div class="btn btn-sm" data-action="applyMsgTemplate" data-arg-tmpl="${esc(t.id)}" style="cursor:pointer;margin:2px">${esc(t.name)}</div>`).join('');
  const agents = (rawData.agents && rawData.agents.agents) || {};
  const optHtml = Object.entries(agents).map(([k, v]) => `<option value="${k}">${AGENT_NAMES[k] || v.name || k}</option>`).join('');
  document.getElementById('msgTo').innerHTML = optHtml;
  document.getElementById('msgContent').value = ''; document.getElementById('msgTopic').value = ''; document.getElementById('msgTopicGroup').style.display = 'none';
}

function applyMsgTemplate(tmplId) {
  const t = _msgTemplates.find(x => x.id === tmplId);
  if (!t) return;
  document.getElementById('msgContent').value = t.content;
  document.getElementById('msgType').value = t.type;
  const topicGroup = document.getElementById('msgTopicGroup');
  const topicLabel = document.getElementById('msgTopicLabel');
  if (t.content.includes('{topic}')) { topicGroup.style.display = ''; topicLabel.textContent = '调研主题:'; }
  else if (t.content.includes('{description}')) { topicGroup.style.display = ''; topicLabel.textContent = '代码描述:'; }
  else if (t.content.includes('{message}')) { topicGroup.style.display = ''; topicLabel.textContent = '通知内容:'; }
  else if (t.content.includes('{question}')) { topicGroup.style.display = ''; topicLabel.textContent = '问题:'; }
  else { topicGroup.style.display = 'none'; }
}

async function sendMsg() {
  const to = document.getElementById('msgTo').value;
  const type = document.getElementById('msgType').value;
  let content = document.getElementById('msgContent').value;
  const topic = document.getElementById('msgTopic').value;
  if (!to || !content) { toast('请选择收件人并填写内容', 'error'); return; }
  if (topic) content = content.replace('{topic}', topic).replace('{description}', topic).replace('{message}', topic).replace('{question}', topic);
  try {
    const msg = { id: 'manual-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), from: 'lingzhao', to: to, type: type || 'notice', priority: 'normal', content: content, created_at: new Date().toISOString() };
    const writeR = await fetch(apiUrl('/api/send-msg'), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:to,msg:msg})});
    const writeData = await writeR.json();
    if (writeData.status === 'sent') { toast('✅ 消息已发送给 ' + to, 'success'); document.getElementById('sendMsgModal').classList.remove('open'); loadAll(); }
    else { toast('⚠️ 消息可能需要手动确认，请检查日志', 'warn'); }
  } catch(e) { toast('发送失败: ' + e.message, 'error'); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

initParticles();
