<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ziyan-mailbus Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;padding:24px;min-height:100vh}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{color:#64748b;font-size:13px;margin-bottom:20px}

#toast{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#1e293b;border:1px solid #475569;border-radius:8px;padding:10px 16px;font-size:13px;animation:slideIn .3s;max-width:350px}
.toast.success{border-color:#22c55e;color:#6ee7b7}
.toast.error{border-color:#ef4444;color:#fca5a5}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* 导航标签 */
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid #334155}
.tab{padding:10px 20px;cursor:pointer;font-size:13px;color:#64748b;border-bottom:2px solid transparent;transition:.2s}
.tab:hover{color:#e2e8f0}
.tab.active{color:#22d3ee;border-bottom-color:#22d3ee;font-weight:600}
.tab .num{background:#334155;color:#94a3b8;font-size:10px;padding:1px 6px;border-radius:6px;margin-left:4px}
.tab.active .num{background:#164e63;color:#22d3ee}

.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:8px 12px;border-radius:6px;font-size:13px;min-width:200px}
.btn{background:#334155;border:1px solid #475569;color:#e2e8f0;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{background:#475569}
.btn-primary{background:#2563eb;border-color:#3b82f6}
.btn-primary:hover{background:#3b82f6}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{background:#dc2626;border-color:#ef4444}

.tab-content{display:none}
.tab-content.active{display:block}

/* Agent 概览卡片（tab 1） */
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.agent-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;cursor:pointer;transition:.2s}
.agent-card:hover{border-color:#475569;background:#1f3147}
.agent-card .top{display:flex;justify-content:space-between;align-items:start}
.agent-card .name{font-weight:600;font-size:14px}
.agent-card .type-badge{font-size:10px;padding:2px 8px;border-radius:8px;background:#0c1929;color:#93c5fd}
.agent-card .role{font-size:11px;color:#94a3b8;margin:2px 0 6px}
.agent-card .stats{display:flex;gap:12px;font-size:11px;color:#64748b;margin-top:6px;padding-top:6px;border-top:1px solid #1e293b}
.agent-card .stats span{display:flex;align-items:center;gap:4px}

/* 消息列表（tab 2 & 3） */
.msg-list{display:flex;flex-direction:column;gap:6px}
.msg-item{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 12px}
.msg-item .head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;margin-bottom:4px}
.msg-item .body{font-size:13px;line-height:1.5}
.msg-item .from-to{font-size:11px;color:#475569;margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#94a3b8;font-weight:500;padding:8px 10px;border-bottom:1px solid #334155;font-size:11px}
td{padding:8px 10px;border-bottom:1px solid #1e293b}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-green{background:#064e3b;color:#6ee7b7}
.badge-red{background:#450a0a;color:#fca5a5}
.badge-yellow{background:#451a03;color:#fdba74}
.badge-blue{background:#0c1929;color:#93c5fd}
.badge-gray{background:#1e293b;color:#94a3b8}

/* 弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;overflow:auto;padding:40px 20px}
.modal.open{display:block}
.modal-inner{background:#1e293b;border:1px solid #475569;border-radius:12px;max-width:700px;margin:0 auto;padding:24px;max-height:85vh;overflow:auto}
.modal-inner .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-inner .header h2{font-size:18px}
.modal-inner .section-title{font-size:12px;font-weight:600;color:#94a3b8;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.modal-inner .info-block{background:#0f172a;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;max-height:160px;overflow:auto;margin-bottom:4px}
.modal-inner .skill-tag{display:inline-block;background:#0c1929;color:#93c5fd;padding:3px 10px;border-radius:12px;font-size:11px;margin:2px}
.modal-inner .msg-block{background:#0f172a;border-radius:6px;padding:10px;margin-bottom:6px}
.modal-inner .msg-block .meta{font-size:10px;color:#475569}
.modal-inner .msg-block .text{font-size:12px;margin-top:2px}

@media(max-width:600px){.agent-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="toast"></div>

<h1>📬 ziyan-mailbus Platform</h1>
<div class="sub">HTTP API: <span id="apiUrl">http://localhost:9812</span></div>

<div class="toolbar">
  <input class="search-input" id="apiInput" value="http://localhost:9812" placeholder="API 地址">
  <button class="btn btn-primary" onclick="loadAll()">🔄 刷新全部</button>
  <button class="btn" onclick="triggerHeartbeat()">💓 触发心跳</button>
</div>

<!-- 导航标签 -->
<div class="tabs" id="mainTabs">
  <div class="tab active" data-tab="agents" onclick="switchTab('agents')">🤖 Agent <span class="num" id="tabAgentCount"></span></div>
  <div class="tab" data-tab="messages" onclick="switchTab('messages')">📨 消息 <span class="num" id="tabMsgCount"></span></div>
  <div class="tab" data-tab="pending" onclick="switchTab('pending')">⏳ 待处理 <span class="num" id="tabPendingCount"></span></div>
  <div class="tab" data-tab="tasks" onclick="switchTab('tasks')">🎯 任务追踪</div>
  <div class="tab" data-tab="heartbeat" onclick="switchTab('heartbeat')">💓 健康状态</div>
  <div class="tab" data-tab="alerts" onclick="switchTab('alerts')">🔔 告警</div>
</div>

<!-- Tab: Agent 总览 -->
<div class="tab-content active" id="tab-agents">
  <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;color:#94a3b8">点击卡片查看详情 · 身份 · 技能 · 消息</span>
    <button class="btn btn-sm" onclick="reloadData('agents')">🔄 刷新</button>
  </div>
  <div class="agent-grid" id="agentGrid"></div>
</div>

<!-- Tab: 全部消息 -->
<div class="tab-content" id="tab-messages">
  <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;color:#94a3b8" id="msgSummary"></span>
    <button class="btn btn-sm" onclick="reloadData('messages')">🔄 刷新</button>
  </div>
  <div class="msg-list" id="allMessagesList"></div>
</div>

<!-- Tab: 待处理 -->
<div class="tab-content" id="tab-pending">
  <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;color:#94a3b8" id="pendingSummary"></span>
    <button class="btn btn-sm" onclick="reloadData('pending')">🔄 刷新</button>
  </div>
  <div class="msg-list" id="pendingMessagesList"></div>
</div>

<!-- Tab: 任务追踪 -->
<div class="tab-content" id="tab-tasks">
  <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;color:#94a3b8"><span id="taskCount"></span> 个活跃任务</span>
    <button class="btn btn-sm" onclick="reloadData('tasks')">🔄 刷新</button>
  </div>
  <div id="taskTable"></div>
</div>

<!-- Tab: 健康状态 -->
<div class="tab-content" id="tab-heartbeat">
  <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;color:#94a3b8">Agent 在线状态 · AgentMemory · 磁盘</span>
    <button class="btn btn-sm" onclick="reloadData('heartbeat')">🔄 刷新</button>
  </div>
  <div id="heartbeatContent"></div>
</div>

<!-- Tab: 告警 -->
<div class="tab-content" id="tab-alerts">
  <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;color:#94a3b8"><span id="alertCount"></span> 条告警</span>
    <button class="btn btn-sm" onclick="reloadData('alerts')">🔄 刷新</button>
  </div>
  <div id="alertTable"></div>
</div>

<!-- Agent 详情弹窗 -->
<div class="modal" id="agentModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-inner" id="agentModalContent"></div>
</div>

<script>
let rawData = {};
let refreshTimer = null;

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function apiUrl(p) {
  const b = document.getElementById('apiInput').value.replace(/\/+$/, '');
  return b + p;
}

async function fetchJSON(p) {
  const r = await fetch(apiUrl(p));
  return await r.json();
}

function statusBadge(s) {
  if (!s) return '<span class="badge badge-gray">未知</span>';
  if (s === 'online' || s === 'healthy' || s === 'ok' || s === 'success') return '<span class="badge badge-green">● ' + s + '</span>';
  if (s === 'offline' || s === 'failed' || s === 'unreachable') return '<span class="badge badge-red">● ' + s + '</span>';
  if (s === 'warn' || s === 'running' || s === 'timeout') return '<span class="badge badge-yellow">● ' + s + '</span>';
  if (s === 'pending') return '<span class="badge badge-yellow">⏳ 待处理</span>';
  return '<span class="badge badge-blue">● ' + s + '</span>';
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ── 主加载 ──

async function loadAll() {
  try {
    const [status, agents, tasks, hb, alerts] = await Promise.all([
      fetchJSON('/api/status'), fetchJSON('/api/agents'), fetchJSON('/api/tasks'),
      fetchJSON('/api/heartbeat'), fetchJSON('/api/alerts'),
    ]);
    rawData = { status, agents, tasks, hb, alerts };
    renderAgentTab(status, agents);
    renderMessagesTab(status);
    renderPendingTab(status);
    renderTasks(tasks);
    renderHeartbeat(hb);
    renderAlerts(alerts);
    toast('已刷新', 'success');
    try {
      const cfg = await fetchJSON('/api/config');
      const interval = cfg.dashboard_refresh_seconds || 0;
      if (refreshTimer) clearInterval(refreshTimer);
      if (interval > 0) refreshTimer = setInterval(() => {
        reloadData('heartbeat'); reloadData('tasks'); reloadData('alerts');
      }, interval * 1000);
    } catch(e) {}
  } catch(e) {
    toast('加载失败: ' + e.message, 'error');
  }
}

async function reloadData(name) {
  const map = {
    agents: ['/api/status', '/api/agents'],
    messages: ['/api/status'],
    pending: ['/api/status'],
    tasks: ['/api/tasks'],
    heartbeat: ['/api/heartbeat'],
    alerts: ['/api/alerts'],
  };
  try {
    const results = await Promise.all(map[name].map(p => fetchJSON(p)));
    if (name === 'agents') { rawData.status = results[0]; rawData.agents = results[1]; renderAgentTab(results[0], results[1]); }
    if (name === 'messages') { rawData.status = results[0]; renderMessagesTab(results[0]); }
    if (name === 'pending') { rawData.status = results[0]; renderPendingTab(results[0]); }
    if (name === 'tasks') { rawData.tasks = results[0]; renderTasks(results[0]); }
    if (name === 'heartbeat') { rawData.hb = results[0]; renderHeartbeat(results[0]); }
    if (name === 'alerts') { rawData.alerts = results[0]; renderAlerts(results[0]); }
    toast(name + ' 已刷新', 'success');
  } catch(e) { toast('刷新失败', 'error'); }
}

// ── Tab 1: Agent 概览 ──

function renderAgentTab(status, agentsData) {
  const grid = document.getElementById('agentGrid');
  const countEl = document.getElementById('tabAgentCount');
  if (!agentsData || !agentsData.agents) { grid.innerHTML = '<div style="color:#64748b">无数据</div>'; return; }
  const agents = agentsData.agents;
  const statuses = (status && status.agent_statuses) || {};
  countEl.textContent = Object.keys(agents).length;
  grid.innerHTML = Object.entries(agents).map(([k, v]) => {
    const st = statuses[k] || {};
    const active = st.active_messages || 0;
    const pending = st.pending_count || 0;
    const typeColors = {hermes:'#22d3ee', hermes_profile:'#67e8f9', openclaw:'#34d399', cline:'#a78bfa', opencode:'#fbbf24', none:'#64748b'};
    return `<div class="agent-card" onclick="showAgent('${k}')">
      <div class="top">
        <div class="name">${v.name || k}</div>
        <span class="type-badge" style="color:${typeColors[v.type]||'#93c5fd'}">${v.type}</span>
      </div>
      <div class="role">${v.role || '—'}</div>
      <div style="font-size:10px;color:#475569">${(v.models||[]).join(', ') || ''}</div>
      <div class="stats">
        <span>📨 ${active}</span>
        <span>⏳ ${statusData => pending}</span>
      </div>
    </div>`;
  }).join('');
}

// ── Tab 2: 全部消息 ──

async function renderMessagesTab(status) {
  const list = document.getElementById('allMessagesList');
  const summary = document.getElementById('msgSummary');
  const countEl = document.getElementById('tabMsgCount');
  if (!status || !status.agent_statuses) { list.innerHTML = '<div style="color:#64748b">无数据</div>'; return; }
  const entries = Object.entries(status.agent_statuses);
  let totalActive = 0;
  let html = '';
  for (const [name, st] of entries) {
    const count = st.active_messages || 0;
    totalActive += count;
    if (count === 0) continue;
    try {
      const inbox = await fetchJSON('/api/inbox/' + name);
      const msgs = inbox.messages || [];
      html += `<div style="margin:8px 0 4px;font-size:12px;color:#94a3b8;font-weight:600">${st.type || name} (${count})</div>`;
      msgs.forEach(m => {
        html += `<div class="msg-item">
          <div class="head">
            <span>${esc(m.from || '?')} → ${name}</span>
            <span>${statusBadge(m.status)}</span>
          </div>
          <div class="body">${esc(m.content_preview || '')}</div>
          <div class="from-to">${m.id} · ${m.created_at || ''}</div>
        </div>`;
      });
    } catch(e) {}
  }
  summary.textContent = '共 ' + totalActive + ' 条未归档消息';
  countEl.textContent = totalActive;
  list.innerHTML = html || '<div style="color:#64748b">暂无消息</div>';
}

// ── Tab 3: 待处理消息 ──

async function renderPendingTab(status) {
  const list = document.getElementById('pendingMessagesList');
  const summary = document.getElementById('pendingSummary');
  const countEl = document.getElementById('tabPendingCount');
  if (!status || !status.agent_statuses) { list.innerHTML = '<div style="color:#64748b">无数据</div>'; return; }
  const entries = Object.entries(status.agent_statuses);
  let totalPending = 0;
  let html = '';
  for (const [name, st] of entries) {
    try {
      const inbox = await fetchJSON('/api/inbox/' + name);
      const pendings = (inbox.messages || []).filter(m => m.status === 'pending');
      if (pendings.length === 0) continue;
      totalPending += pendings.length;
      html += `<div style="margin:8px 0 4px;font-size:12px;color:#fdba74;font-weight:600">${st.type || name} (${pendings.length})</div>`;
      pendings.forEach(m => {
        html += `<div class="msg-item" style="border-color:#451a03">
          <div class="head">
            <span>${esc(m.from || '?')} → ${name}</span>
            <span>${statusBadge(m.status)}</span>
          </div>
          <div class="body">${esc(m.content_preview || '')}</div>
          <div class="from-to">${m.id} · ${m.created_at || ''}</div>
        </div>`;
      });
    } catch(e) {}
  }
  summary.textContent = totalPending + ' 条待处理';
  countEl.textContent = totalPending;
  list.innerHTML = html || '<div style="color:#64748b">🎉 全部已处理</div>';
}

// ── Agent 详情弹窗 ──

async function showAgent(name) {
  try {
    const [profile, inbox] = await Promise.all([
      fetchJSON('/api/agent-profile/' + name),
      fetchJSON('/api/inbox/' + name),
    ]);
    const cfg = profile.config || {};
    const agentName = cfg.name || name;
    const activeMsgs = inbox.messages || [];
    const pending = activeMsgs.filter(m => m.status === 'pending');
    const totalActive = inbox.active_messages || activeMsgs.length;

    let html = `<div class="header">
      <h2>${esc(agentName)} <span style="font-size:12px;color:#64748b;font-weight:400">${cfg.type || ''}</span></h2>
      <button class="btn btn-sm" onclick="closeModal()">✕</button>
    </div>`;

    // 基础信息
    html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">`;
    if (cfg.type) html += `<span class="badge badge-blue">${cfg.type}</span>`;
    if (cfg.role) html += `<span style="color:#94a3b8;font-size:12px">${cfg.role}</span>`;
    if (cfg.models) html += `<span style="color:#475569;font-size:11px">${cfg.models.join(', ')}</span>`;
    html += `</div>`;

    // 消息统计
    html += `<div style="display:flex;gap:16px;font-size:11px;color:#64748b;margin:8px 0 4px">
      <span>📨 总计 <strong style="color:#e2e8f0">${inbox.total_messages || 0}</strong></span>
      <span>未归档 <strong style="color:#e2e8f0">${totalActive}</strong></span>
      <span>⏳ 待处理 <strong style="color:#fdba74">${pending.length}</strong></span>
    </div>`;

    // 身份
    if (profile.identity) {
      html += `<div class="section-title">🧬 身份</div><div class="info-block">${esc(profile.identity)}</div>`;
    }
    if (profile.soul) {
      html += `<div class="section-title">💫 人设</div><div class="info-block">${esc(profile.soul)}</div>`;
    }

    // 技能
    if (profile.skills && profile.skills.length > 0) {
      html += `<div class="section-title">🛠 技能 (${profile.skills.length})</div><div>`;
      profile.skills.forEach(s => { html += `<span class="skill-tag">${s}</span>`; });
      html += `</div>`;
    }

    // 待处理消息
    if (pending.length > 0) {
      html += `<div class="section-title" style="color:#fdba74">⏳ 待处理消息</div>`;
      pending.forEach(m => {
        html += `<div class="msg-block" style="border-left:2px solid #eab308">
          <div class="meta">${esc(m.from || '?')} · ${m.created_at || ''}</div>
          <div class="text">${esc(m.content_preview || m.content || '')}</div>
        </div>`;
      });
    }

    // 最近已处理
    const recent = activeMsgs.filter(m => m.status !== 'pending').slice(-8).reverse();
    if (recent.length > 0) {
      html += `<div class="section-title">📋 最近已处理</div>`;
      recent.forEach(m => {
        html += `<div class="msg-block">
          <div class="meta">${statusBadge(m.status)} ${esc(m.from || '?')} → ${agentName} · ${m.created_at || ''}</div>
          <div class="text">${esc((m.content_preview || '').slice(0, 120))}</div>
        </div>`;
      });
    }

    document.getElementById('agentModalContent').innerHTML = html;
    document.getElementById('agentModal').classList.add('open');
  } catch(e) {
    toast('加载失败: ' + e.message, 'error');
  }
}

function closeModal() {
  document.getElementById('agentModal').classList.remove('open');
}

// ── Tab 4: 任务追踪 ──

function renderTasks(t) {
  const el = document.getElementById('taskTable');
  const count = document.getElementById('taskCount');
  if (!t || !t.tasks || t.tasks.length === 0) { el.innerHTML = '<div style="color:#64748b;font-size:13px">暂无活跃任务</div>'; count.textContent = ''; return; }
  count.textContent = t.count;
  const rows = t.tasks.map(task => {
    const hops = (task.chain || []).map(h => `${h.agent}:${h.action}`).join(' → ');
    const creator = (task.chain && task.chain[0]) ? task.chain[0].agent : '-';
    return `<tr>
      <td style="font-size:11px;color:#64748b">${task.task_id}</td>
      <td>${statusBadge(task.status)}</td>
      <td>${task.summary || '-'}</td>
      <td>${creator}</td>
      <td>${task.assignee || '-'}</td>
      <td style="font-size:11px;color:#64748b;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hops || '-'}</td>
      <td style="font-size:11px;color:#64748b">${task.reminded_count || 0}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table><thead><tr><th>ID</th><th>状态</th><th>概要</th><th>发起人</th><th>负责人</th><th>追踪链</th><th>催办</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── Tab 5: 健康状态 ──

function renderHeartbeat(hb) {
  const el = document.getElementById('heartbeatContent');
  if (!hb) { el.innerHTML = '<div style="color:#64748b">无数据</div>'; return; }
  const agents = hb.agents || {};
  const health = hb.health || {};
  const am = health.agentmemory || {};
  const disk = health.disk || {};
  const inboxWarnings = health.inbox_warnings || [];
  const rows = Object.entries(agents).map(([name, state]) => {
    const dot = state.status === 'online' ? '🟢' : state.status === 'offline' ? '🔴' : '⚪';
    return `<tr>
      <td>${dot} ${name}</td>
      <td>${statusBadge(state.status)}</td>
      <td style="font-size:11px;color:#64748b">${state.last_heartbeat || '-'}</td>
      <td style="font-size:11px;color:#64748b">${state.missed_pings || 0}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `
    <div style="display:flex;gap:16px;font-size:12px;margin-bottom:12px;padding:12px;background:#1e293b;border-radius:8px">
      <span>📦 AgentMemory: ${statusBadge(am.status)}</span>
      <span>💾 磁盘: ${disk.size_mb ? disk.size_mb + 'MB' : '-'}</span>
      <span>📨 积压: ${inboxWarnings.length ? inboxWarnings.map(w => w.agent+'('+w.count+')').join(', ') : '无'}</span>
    </div>
    <table><thead><tr><th>Agent</th><th>状态</th><th>最后心跳</th><th>失联</th></tr></thead><tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:#64748b">无数据</td></tr>'}</tbody></table>
  `;
}

// ── Tab 6: 告警 ──

function renderAlerts(a) {
  const el = document.getElementById('alertTable');
  const count = document.getElementById('alertCount');
  if (!a || !a.alerts || a.alerts.length === 0) { el.innerHTML = '<div style="color:#64748b;font-size:13px">无告警</div>'; count.textContent = ''; return; }
  count.textContent = a.count;
  const rows = a.alerts.slice().reverse().slice(0, 30).map(alert => {
    const sc = {critical:'#fca5a5', warn:'#fdba74', info:'#93c5fd'};
    return `<tr>
      <td><span style="color:${sc[alert.severity]||'#94a3b8'}">●</span> ${alert.severity}</td>
      <td>${alert.type}</td>
      <td>${alert.agent}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${alert.message}</td>
      <td style="font-size:11px;color:#64748b">${alert.created_at || ''}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table><thead><tr><th>级别</th><th>类型</th><th>Agent</th><th>消息</th><th>时间</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── 心跳触发 ──

async function triggerHeartbeat() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    const data = await fetchJSON('/api/heartbeat?force=1');
    rawData.hb = data; renderHeartbeat(data);
    btn.textContent = '✅';
    setTimeout(() => { btn.textContent = '💓 触发心跳'; btn.disabled = false; }, 2000);
  } catch(e) {
    btn.textContent = '❌';
    setTimeout(() => { btn.textContent = '💓 触发心跳'; btn.disabled = false; }, 2000);
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

loadAll();
</script>
</body>
