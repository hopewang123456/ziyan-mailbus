<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审查报告 · mailbus</title>
<style>
:root {
  --bg-deep: #050510;
  --bg-surface: #0a0a1a;
  --bg-card: #0f172a;
  --bg-card-hover: #1a1a3e;
  --text-primary: #e0e6f0;
  --text-secondary: #8892b0;
  --text-muted: #4a5578;
  --accent-cyan: #00d4ff;
  --accent-blue: #3b82f6;
  --accent-green: #10b981;
  --accent-gold: #f59e0b;
  --border: rgba(51,65,85,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:'Inter','SF Pro','system-ui',-apple-system,sans-serif;
  padding:24px;
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,212,255,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 80% 90%, rgba(139,92,246,0.05) 0%, transparent 50%);
  pointer-events:none;z-index:0
}
h1{font-size:22px;margin-bottom:4px;position:relative;z-index:1}
.subtitle{color:var(--text-secondary);font-size:13px;margin-bottom:24px;position:relative;z-index:1}
.project-card{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
  position:relative;z-index:1
}
.project-header{
  padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:background 0.15s;color:var(--text-primary)
}
.project-header:hover{background:rgba(0,212,255,0.04)}
.project-name{font-size:16px;font-weight:600;flex:1}
.project-count{font-size:12px;background:rgba(51,65,85,0.5);padding:2px 10px;border-radius:12px;color:var(--text-secondary)}
.project-arrow{transition:transform .2s;font-size:12px;color:var(--text-muted)}
.project-card.open .project-arrow{transform:rotate(90deg)}
.report-list{display:none;border-top:1px solid var(--border)}
.project-card.open .report-list{display:block}
.report-item{
  padding:12px 20px 12px 32px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:background 0.1s;font-size:14px;color:var(--text-primary)
}
.report-item:hover{background:rgba(0,212,255,0.03)}
.report-time{color:var(--text-muted);font-size:12px;min-width:140px}
.report-name{flex:1;color:var(--accent-cyan)}
.report-size{color:var(--text-muted);font-size:12px}
.report-content{display:none;padding:16px 32px 24px;border-top:1px solid rgba(51,65,85,0.2)}
.report-content.show{display:block}
.report-content pre{background:rgba(15,23,42,0.6);padding:16px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.6;max-height:80vh;overflow-y:auto;color:var(--text-primary)}
.report-content .loading{color:var(--text-muted);font-style:italic}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted);position:relative;z-index:1}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{margin:4px 0}
</style>
</head>
<body>

<h1>📋 代码审查报告</h1>
<p class="subtitle" id="subtitle">加载中...</p>

<div id="projects"></div>

<script>
async function load() {
  try {
    const res = await fetch('/api/reports/projects');
    const data = await res.json();
    const container = document.getElementById('projects');
    const subtitle = document.getElementById('subtitle');
    const projects = data.projects || {};
    const total = Object.values(projects).flat().length;
    subtitle.textContent = `共 ${Object.keys(projects).length} 个项目，${total} 份审查报告`;

    if (Object.keys(projects).length === 0) {
      container.innerHTML = '<div class="empty"><div class="icon">🔍</div><p>暂无审查报告</p><p style="font-size:12px;margin-top:8px;color:var(--text-muted)">提交代码后 watcher 会自动触发审查</p></div>';
      return;
    }

    for (const [project, reports] of Object.entries(projects)) {
      const card = document.createElement('div');
      card.className = 'project-card';
      const header = document.createElement('div');
      header.className = 'project-header';
      header.innerHTML = '<span class="project-arrow">▶</span><span class="project-name">📁 ' + project + '</span><span class="project-count">' + reports.length + ' 份</span>';
      header.onclick = () => card.classList.toggle('open');
      const list = document.createElement('div');
      list.className = 'report-list';

      for (const r of reports) {
        const item = document.createElement('div');
        item.className = 'report-item';
        item.innerHTML = '<span class="report-time">' + r.time + '</span><span class="report-name">' + r.file + '</span><span class="report-size">' + (r.size / 1024).toFixed(1) + ' KB</span>';

        const content = document.createElement('div');
        content.className = 'report-content';
        content.innerHTML = '<div class="loading">加载中...</div>';

        item.onclick = async (e) => {
          e.stopPropagation();
          const isOpen = content.classList.contains('show');
          list.querySelectorAll('.report-content.show').forEach(el => el.classList.remove('show'));
          if (isOpen) return;
          content.classList.add('show');
          if (content.dataset.loaded) return;
          content.dataset.loaded = '1';
          try {
            const rres = await fetch('/api/reports/' + encodeURIComponent(r.file));
            const rdata = await rres.json();
            content.innerHTML = rdata.html ? rdata.html : '<pre>' + (rdata.raw || '无内容') + '</pre>';
          } catch (e) {
            content.innerHTML = '<pre style="color:var(--accent-red);">加载失败: ' + e.message + '</pre>';
          }
        };

        list.appendChild(item);
        list.appendChild(content);
      }

      card.appendChild(header);
      card.appendChild(list);
      container.appendChild(card);
    }
  } catch (e) {
    document.getElementById('projects').innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>加载失败: ' + e.message + '</p></div>';
  }
}

load();
</script>
</body>
</html>
