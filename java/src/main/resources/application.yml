server:
  port: ${MAILBUS_PORT:8080}

spring:
  application:
    name: mailbus-java
  datasource:
    url: jdbc:sqlite:${MAILBUS_DATA_DIR:../data}/mailbus.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 10000
  jackson:
    default-property-inclusion: always
    property-naming-strategy: SNAKE_CASE

mailbus:
  data-dir: ${MAILBUS_DATA_DIR:../data}
  session-days: ${MAILBUS_SESSION_DAYS:7}
  heartbeat-timeout-seconds: ${MAILBUS_HEARTBEAT_TIMEOUT_SEC:180}
  heartbeat-sweep-seconds: ${MAILBUS_HEARTBEAT_SWEEP_SEC:30}
  dispatch-interval-seconds: ${MAILBUS_DISPATCH_INTERVAL_SEC:5}
  dispatch-batch: ${MAILBUS_DISPATCH_BATCH:50}
  dispatch-max-attempts: ${MAILBUS_DISPATCH_MAX_ATTEMPTS:3}
  layout-path: ${MAILBUS_LAYOUT_PATH:../config/office-layout.json}
  metrics-manifest-path: ${MAILBUS_METRICS_MANIFEST:../shared/config/mailbus/metrics-manifest.json}
  contract-path: ${MAILBUS_CONTRACT_PATH:../shared/contracts/generated/openapi.json}

logging:
  level:
    root: INFO
    io.github.hopewang123456.mailbus: INFO
