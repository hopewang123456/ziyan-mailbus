mailbus:
  storage: sqlite   # sqlite (default: Flyway + file store) | memory (demo)
  data-dir: ./store
  ai:
    enabled: false  # L3 (P0c): true 时 AI 助手/指标问答装配激活（openai 兼容 provider 已就位）
    provider: ""
    model: ""

spring.ai.openai:
  api-key: ${SPRING_AI_OPENAI_API_KEY:sk-mailbus-placeholder}  # 占位避免无 key 炸启动；真实 key/deepseek 端点经环境变量覆盖
  base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}  # deepseek: https://api.deepseek.com；ollama: http://127.0.0.1:11434（/v1 兼容）

spring:
  application:
    name: mailbus-j
  datasource:
    # Default profile = SQLite (zero-dependency). MySQL switch = config-only:
    #   url: jdbc:mysql://host:3306/mailbus?useSSL=false
    #   driver-class-name: com.mysql.cj.jdbc.Driver  (+ credentials)
    url: jdbc:sqlite:${mailbus.data-dir:./store}/metadata.db
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
  threads:
    virtual:
      enabled: false  # flip to true on JDK 21 (M2 scheduler)

server:
  port: 9815          # 9814 is the Python serve; parallel-run friendly

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
