# EXAMPLE — local-only volume overrides via env (no hardcoded sibling paths).
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   cp .env.example .env   # fill MAILBUS_HOST_ROOT + workspace vars
#
# docker compose reads docker-agents/.env for ${VAR} substitution.
# Do not commit override.yml or .env — machine-private.
#
# Optional: mailbus compose sync

services:
  hermes:
    volumes:
      - ${MAILBUS_HOST_ROOT}/store:/mailbus/store
      - ${MAILBUS_HOST_ROOT}/tools:/mailbus/tools:ro
      - ${MAILBUS_HOST_ROOT}/lib:/mailbus/lib:ro
      - ${MAILBUS_HOST_ROOT}/access:/mailbus/access:ro
      - ${MAILBUS_HOST_ROOT}/access/external-tools:/mailbus/external-tools:ro
      - ${HERMES_DATA}/.hermes:/home/hermes/.hermes:rw
  openclaw:
    volumes:
      - ${MAILBUS_HOST_ROOT}/store:/mailbus/store
      - ${MAILBUS_HOST_ROOT}/tools:/mailbus/tools:ro
      - ${MAILBUS_HOST_ROOT}/lib:/mailbus/lib:ro
      - ${MAILBUS_HOST_ROOT}/access:/mailbus/access:ro
      - ${OPENCLAW_WORKSPACE}:/workspace:rw
  codex-web:
    volumes:
      - ${MAILBUS_HOST_ROOT}/store:/mailbus/store
      - ${MAILBUS_HOST_ROOT}/tools:/mailbus/tools:ro
      - ${MAILBUS_HOST_ROOT}/lib:/mailbus/lib:ro
      - ${MAILBUS_HOST_ROOT}/access:/mailbus/access:ro
      - ${CODEX_WORKSPACE}:/workspace/codex:ro
  codex-review:
    volumes:
      - ${MAILBUS_HOST_ROOT}/store:/mailbus/store
      - ${MAILBUS_HOST_ROOT}/tools:/mailbus/tools:ro
      - ${MAILBUS_HOST_ROOT}/lib:/mailbus/lib:ro
      - ${MAILBUS_HOST_ROOT}/access:/mailbus/access:ro
      - ${CODEX_REVIEW_WORKSPACE}:/workspace/codex-review:ro
  opencode:
    volumes:
      - ${MAILBUS_HOST_ROOT}/store:/mailbus/store
      - ${MAILBUS_HOST_ROOT}/tools:/mailbus/tools:ro
      - ${MAILBUS_HOST_ROOT}/lib:/mailbus/lib:ro
      - ${MAILBUS_HOST_ROOT}/access:/mailbus/access:ro
      - ${OPENCODE_ROOT}:/workspace/opencode:rw
  mailbus:
    volumes:
      - ${MAILBUS_HOST_ROOT}:/mailbus
      - ${MAILBUS_HOST_ROOT}/store:/mailbus/store
      - ${MAILBUS_HOST_ROOT}/run:/mailbus/run
      - ${MAILBUS_HOST_ROOT}/tools:/mailbus/tools:ro
      - ${MAILBUS_HOST_ROOT}/lib:/mailbus/lib:ro
      - ${MAILBUS_HOST_ROOT}/access:/mailbus/access:ro
      - ${MAILBUS_HOST_ROOT}/access/external-tools:/mailbus/external-tools:ro
