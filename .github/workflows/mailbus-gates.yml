# Mailbus gate subset — e2e L-gates + V acceptance + Wave F3/F4 + web build.
# Full suite: python -m pytest tests -q
name: mailbus-gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: pytest e2e + v_suite + auth/cors + pipeline/settings/compose/device
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/e2e -q \
            tests/test_acceptance_v_suite.py \
            tests/test_v6_enable_rollback.py \
            tests/test_wave_f3_f4_gates.py \
            tests/test_ports_import.py \
            tests/test_application_clock_lint.py \
            tests/test_transport_wave3.py \
            tests/test_framework_entry_points.py \
            tests/test_integration_entry_points.py \
            tests/test_no_secrets_in_git.py \
            tests/test_config_files.py \
            tests/test_config_readers_no_example.py \
            tests/test_mailbus_token.py \
            tests/test_cors.py \
            tests/test_doctor_auth.py \
            tests/test_decouple_paths.py \
            tests/test_compose_files.py \
            tests/test_dispatch_governance.py \
            tests/test_pipeline_step_failover.py \
            tests/test_failover_after_two.py \
            tests/test_failover_metrics.py \
            tests/test_pipeline_trigger_p0.py \
            tests/test_launch_ports_settings.py \
            tests/test_sync_layers.py \
            tests/test_device_bridge.py \
            tests/test_p10_dispatch_delivery.py \
            tests/test_connection_test.py \
            tests/test_push_budget.py \
            tests/test_dlq_and_loops.py \
            tests/test_token_ledger.py \
            tests/test_demo_chain.py \
            tests/test_demo_api.py \
            tests/test_wave3_onboarding.py \
            tests/test_wave4_stations.py \
            tests/test_harness_production_wait.py \
            tests/test_tracker.py \
            tests/test_api_error_envelope.py \
            tests/test_framework_skills.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci && build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
