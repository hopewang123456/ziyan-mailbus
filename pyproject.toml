[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbus"
version = "0.2.0"
description = "子言 AI 团队 mailbus 统一 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "Markdown>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
mailbus = "tools.mailbus:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "tools*"]
