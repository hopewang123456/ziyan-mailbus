[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbus"
version = "1.0.0"
description = "mailbus AI agent message bus"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mailbus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
norecursedirs = [".git", "__pycache__", ".pytest_cache", "data"]
