# ComfyUI GPU（WSL2 + NVIDIA Container Toolkit）
# Models/output paths via env (no machine-absolute defaults in git).
#
# Example (WSL):
#   export COMFYUI_MODELS_HOST=/mnt/e/path/to/ComfyUI/models
#   export COMFYUI_OUTPUT_HOST=/mnt/e/path/to/ComfyUI/output
#   export HTTP_PROXY=http://host.docker.internal:7897
#   export HTTPS_PROXY=http://host.docker.internal:7897
#
# Or copy docker-compose.comfyui-gpu.override.example.yml →
# docker-compose.comfyui-gpu.override.yml (gitignored).
#
# 前置：wsl -u root bash docker-agents/install-comfyui-gpu-wsl.sh
# 构建+启动：wsl bash docker-agents/start-comfyui-gpu.sh --build

services:
  comfyui:
    build:
      context: ./comfyui-gpu
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: mailbus-comfyui-gpu:cu128
    container_name: mailbus-comfyui-gpu
    ports:
      - "8188:8188"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${COMFYUI_MODELS_HOST:-./comfyui-data/models}:/opt/ComfyUI/models
      - ${COMFYUI_OUTPUT_HOST:-./comfyui-data/output}:/opt/ComfyUI/output
      - comfyui-input:/opt/ComfyUI/input
    gpus: all
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--lowvram"]

volumes:
  comfyui-input:
