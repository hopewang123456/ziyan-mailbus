# Mailbus migrate manifest — paths declared independently (no single REPO_ROOT assumption)
#
# tier: required | framework | infra
# env:  variable written into .env
# path: default subpath relative to install_prefix (overridable via --mapping)

required:
  - env: MAILBUS_ROOT
    description: mailbus source root
    path: mailbus
  - env: MAILBUS_DATA
    description: store + run runtime data
    path: mailbus/store

infra:
  - env: NODE_MODULES
    description: AgentMemory npm package (@agentmemory/agentmemory)
    path: node_modules
    optional: true
  - env: HERMES_DATA
    description: Hermes runtime root (profiles / memos-plugin / shared-memory); set explicitly in .env or settings
    path: hermes-data
    optional: true
  - env: OPENCLAW_WORKSPACE
    description: OpenClaw container /workspace
    path: openclaw_space
    optional: true
  - env: OPENCODE_ROOT
    description: OpenCode workspace
    path: opencode
    optional: true
  - env: TEAM_PACK_ROOT
    description: team-pack org config
    path: team-pack
    optional: true

# framework agent workspace — can also be derived from transport.json on import
framework_workspaces:
  - env: CODEX_WORKSPACE
    agent_id: agent-f
    path: codex
    optional: true
  - env: CODEX_REVIEW_WORKSPACE
    agent_id: agent-e
    path: codex-review
    optional: true
  - env: DSH_WORKSPACE
    path: dsh
    optional: true
