rules:
  - id: aws-account-id
    patterns:
      - pattern-regex: (?<!\d)(\d{12})(?!\d)
      - metavariable-regex:
          metavariable: $ACCT
          regex: (?<!\d)(\d{12})(?!\d)
      - pattern-not-regex: (?i)(example|test|sample|dummy|placeholder)
    message: 发现疑似 AWS Account ID: $ACCT
    languages:
      - python
      - javascript
      - typescript
      - yaml
      - json
    severity: WARNING
