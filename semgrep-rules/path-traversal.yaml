rules:
  - id: path-traversal
    patterns:
      - pattern-either:
          - pattern: |
              open($USER_INPUT, ...)
          - pattern: |
              open(os.path.join($BASE, $USER_INPUT), ...)
      - metavariable-regex:
          metavariable: $USER_INPUT
          regex: (request\.GET|request\.POST|request\.args|request\.form|request\.json|os\.environ|sys\.argv)
      - pattern-not: os.path.basename(...)
      - pattern-not: os.path.normpath(...)
    message: 路径操作使用了用户输入 $USER_INPUT，可能导致路径遍历
    languages:
      - python
    severity: WARNING
