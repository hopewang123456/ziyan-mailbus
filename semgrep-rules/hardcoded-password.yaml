rules:
  - id: hardcoded-password
    patterns:
      - pattern-either:
          - pattern: |
              $PASS = "..."
          - pattern: |
              $PASSWORD = "..."
          - pattern: |
              $PWD = "..."
      - metavariable-regex:
          metavariable: $PASS
          regex: (?i)(password|passwd|pwd|pass)\s*[=:].{0,5}["']
      - pattern-not: $PASS = os.getenv(...)
      - pattern-not: $PASS = os.environ.get(...)
      - pattern-not: $PASS = environ.get(...)
    message: 发现硬编码密码 "$PASS"
    languages:
      - python
      - javascript
      - typescript
    severity: ERROR
